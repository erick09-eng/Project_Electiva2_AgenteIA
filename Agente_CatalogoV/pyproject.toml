[project]
name = "agentes-mongodb-directo"
version = "0.1.0"
description = "Agentes MCP con conexión directa a MongoDB"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asgiref>=3.9.1",
    "asyncio>=3.4.3",
    "flask>=3.1.2",
    "flask-cors>=6.0.1",
    "mcp>=1.0.0",
    "mirascope[google]>=1.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.1.1",
    "pymongo>=4.6.0",        # Conexión directa a MongoDB
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
]